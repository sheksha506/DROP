spring.application.name=drop-review


# ==========================================
# APPLICATION
# ==========================================



server.port=8083


# ==========================================
# MYSQL DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/drop_review?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

spring.datasource.username=root

spring.datasource.password=root


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always

# ==========================================
# JWT
# ==========================================

drop.jwt.secret=dropSuperSecretKeyForDevelopmentOnlyChangeThisToALongRandomSecretKey123456789

drop.jwt.expiration=86400000
spring.application.name=drop-backend

# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/drops?useSSL=false&serverTimezone=UTC&cachePrepStmts=true&useServerPrepStmts=true&rewriteBatchedStatements=true

spring.datasource.username=root
spring.datasource.password=root

# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=DROP-HikariPool

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.data.redis.timeout=2000ms

# Redis connection pool
spring.data.redis.lettuce.pool.max-active=32
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=8
spring.data.redis.lettuce.pool.max-wait=2000ms

# =========================================================
# SERVER
# =========================================================

server.port=8081

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/plain,text/css
server.compression.min-response-size=1024

# Connection handling
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200
server.tomcat.max-connections=10000

# =========================================================
# GEOAPIFY
# =========================================================

geoapify.api-key=a054f878809b4fbc8d5f8eb5b5a14fb7

# =========================================================
# LOGGING
# =========================================================

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.data.redis=INFO

# ==========================================
# GEOAPIFY HTTP CLIENT
# ==========================================

geoapify.http.max-connections=50
geoapify.http.max-connections-per-route=20

geoapify.http.connection-request-timeout=2s
geoapify.http.connect-timeout=5s
geoapify.http.read-timeout=10s